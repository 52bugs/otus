@let todoItem = item();
<div class="todo-item">
  <div
    class="todo-item__item"
    [appTooltip]="'todo.showDescription' | translate"
    role="button"
    tabindex="0"
    (click)="showDescription.emit(todoItem.id)"
    (keydown.enter)="showDescription.emit(todoItem.id)"
    (dblclick)="isEditing.set(true)"
    [class.todo-item__item--selected]="selectedItemId() === item().id"
  >
    <div class="todo-item__row">
      {{ todoItem.status }}
      @if(isEditing()) {
        <mat-form-field class="todo-list__input">
          <mat-label>{{ 'todo.text' | translate }}</mat-label>
          <input matInput [placeholder]="'todo.textPlaceholder' | translate" [(ngModel)]="newTodoText" /> 
        </mat-form-field>
      } @else {
        <span>{{ todoItem.text }}</span>
      }
    </div>
  </div>
  @if(isEditing()) {
    <app-button class="todo-item_btn button--save" [title]="'todo.save' | translate" (click)="updateItemText()" [appTooltip]="'todo.save' | translate"></app-button>
  } @else {
    <app-button class="todo-item_btn button--delete" [title]="'todo.delete' | translate" (click)="deleteItem.emit(todoItem.id)" [appTooltip]="'todo.delete' | translate"></app-button>    
  }
</div>
