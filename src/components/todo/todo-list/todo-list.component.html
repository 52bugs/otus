<div class="todo-list">
  <h1>Todo list</h1>
  @for(item of items; track item.id) {
    <app-todo-item [label]="item.label"></app-todo-item>
  }
  <div class="todo-list__add-item">
    <input appInput placeholder="Add your new todo">
    <button appButton type="button" class="add">Add task</button>
  </div>
</div>
