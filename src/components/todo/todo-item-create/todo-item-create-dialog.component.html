<div class="todo-item-create-dialog">
  <div class="todo-item-create-dialog__header">
    <h2 mat-dialog-title class="todo-item-create-dialog__title">{{ 'todo.createTitle' | translate }}</h2>
    <button type="button" class="todo-item-create-dialog__close" aria-label="Close" (click)="close()">&times;</button>
  </div>
  <mat-dialog-content class="todo-item-create-dialog__content">
    <app-todo-item-create (created)="close()" />
  </mat-dialog-content>
</div>
